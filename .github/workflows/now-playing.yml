name: now playing
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run on an encoded README
        run: |
          # 2026-07-29 incident: the README was committed base64-encoded and the
          # panel markers became invisible. Fail loudly instead of working blind.
          head -c 200 README.md | grep -q "<p align=" || {
            echo "::error::README.md does not start with markdown (encoded or corrupt?). Refusing to refresh."; exit 1; }
      - name: Regenerate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/now_playing.py
      - name: Commit if changed
        run: |
          git config user.name "Max Kle1nz"
          git config user.email "kleinz@cosmophonix.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Refresh now-playing panel" && git push)
